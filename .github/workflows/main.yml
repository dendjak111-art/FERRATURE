name: Build Ferrature VST3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Plugin
run: cmake --build build --config Release --target Pamplejuce_VST3 --parallel
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ferrature-${{ matrix.os }}
          path: |
            build/**/*_artefacts/Release/VST3/*
            build/**/*_artefacts/VST3/*
            build/**/*_artefacts/Release/Standalone/*
            build/**/*_artefacts/Standalone/*
          if-no-files-found: warn
